<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="RPS.css">
</head>

<body>
    <h2 class="name">Rock Paper Scissors</h2>
    <button class="move-btn" id="rock" onclick="
       playSound('rock');
       playGame('Rock');
     "><img class="move-icon" src="images/rock-emoji.png" alt="Rock" >
    </button>

    <button class="move-btn" onclick="
        playSound('paper');
        playGame('Paper')
     "><img class="move-icon" src="images/paper-emoji.png" alt="Paper" >
    </button>

    <button class="move-btn" onclick="
       playGame('Scissors');
       playSound('scissors');
     "><img class="move-icon" src="images/scissors-emoji.png" alt="Scissors" >
    </button>

    <p class="js-result result"></p>
    <p class="js-moves moves">
        
    </p>  
    <p class="js-score score"></p>

    <button class="reset-btn" onclick="
       score.wins = 0;
       score.losses = 0;  
       score.ties = 0; 
       localStorage.removeItem('score');
       updatescore();
     ">Reset Score
    </button>

    <script src="RPS.js"></script>
</body>

</html>
